name: DAST (OWASP ZAP)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scan the production build, not the dev server: prod has the strict
      # CSP (no unsafe-eval) and none of the dev-only webpack chunks that
      # trigger false positives.
      - name: Build app
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/build-placeholder
          AUTH_SECRET: ci-build-placeholder-secret

      - name: Start app
        run: npm start &
        env:
          MONGODB_URI: mongodb://localhost:27017/build-placeholder
          AUTH_SECRET: ci-build-placeholder-secret

      - name: Wait for app to be ready
        run: |
          echo "Waiting for http://localhost:3000 to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is up!"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
